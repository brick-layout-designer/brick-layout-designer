name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR supersedes the running build.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR commits
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          FAILED=0
          while IFS= read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::error::Bad commit message: $msg"
              echo "  Expected format: type(scope): description"
              echo "  Types: feat fix docs style refactor perf test build ci chore revert"
              FAILED=1
            fi
          # The PR's own commits. HEAD is GitHub's synthetic
          # "Merge <sha> into <sha>" commit, which never matches.
          done < <(git log --no-merges --format='%s' \
                     "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}")

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must follow Conventional Commits: https://www.conventionalcommits.org"
            exit 1
          fi
          echo "All commits follow conventional commit format."

  build:
    uses: ./.github/workflows/build.yml

  sync:
    # Live-sync spike (sync phase P2): yrs, Rust Yjs, through its C API,
    # plus Qt WebSockets, built and tested on every platform. Native arch
    # only; universal macOS builds come when sync ships.
    name: Sync (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-2022, name: windows }
          - { os: macos-14, name: macos }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: qtwebsockets
          cache: true

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLD_SYNC=ON

      - name: Build
        run: cmake --build build --config Release --target bld_sync_tests --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -L sync

  sanitizers:
    # Whole test suite under AddressSanitizer + UndefinedBehaviorSanitizer.
    # UB is made fatal so a report fails the job instead of scrolling past.
    name: Tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers
          max-size: 1G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
          # Qt / fontconfig keep process-lifetime allocations; leak reports
          # would be noise.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 600

  fuzz:
    # libFuzzer on every file parser for a short while (fuzz/README.md).
    name: Fuzz parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fuzz
          max-size: 1G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev ninja-build clang

      - name: Fuzz
        env:
          BLD_FUZZ_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: fuzz/run.sh 30 build-fuzz

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: build-fuzz/fuzz-artifacts

  bluebrick-compat:
    # Vanilla BlueBrick 1.9.2 (native Mono) must read what we write and
    # agree with our exports (scripts/bluebrick-oracle/compat.sh).
    name: Vanilla BlueBrick compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bluebrick-compat
          max-size: 500M

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev ninja-build mono-complete xvfb

      - name: Get BlueBrick 1.9.2
        run: |
          curl -fsSL -o bluebrick.zip https://bluebrick.lswproject.com/download/BlueBrick.1.9.2.zip
          echo "4e0682a9083b4026cbf2a03e71dc9e8b3865cc72e3beac65c299197c7e492847  bluebrick.zip" | sha256sum -c
          unzip -q bluebrick.zip -d bluebrick
          # Both sides use this repository's parts library.
          rm -rf bluebrick/parts
          cp -r parts/BlueBrickParts/parts bluebrick/parts
          mcs -out:bluebrick/bbconv.exe -r:System.Windows.Forms.dll scripts/bluebrick-oracle/bbconv.cs

      - name: Build bld-convert
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target bld_convert

      - name: Compare with vanilla BlueBrick
        env:
          QT_QPA_PLATFORM: offscreen
        run: scripts/bluebrick-oracle/compat.sh bluebrick build/src/app/bld_convert parts/BlueBrickParts/parts

  lint:
    # clang-tidy's bug-finding checks on the lines a pull request changes
    # (blocking) and clang-format on them (advisory); scripts/ci/lint-changes.sh.
    name: Lint changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: qtwebsockets
          cache: true

      # The sync library (src/sync) is linted too, so it's in the build.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lint
          max-size: 1G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev ninja-build clang clang-tidy clang-format

      - name: Build (clang, for the compile database)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBLD_SYNC=ON
          cmake --build build --parallel

      - name: Lint
        run: scripts/ci/lint-changes.sh "origin/${{ github.base_ref }}" build

  coverage:
    # Line / function / branch coverage of src/ by the test suite, as a job
    # summary and an HTML report artifact. Reported, not enforced.
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage
          max-size: 1G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libcups2-dev ninja-build
          pip install --user gcovr

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBLD_DEPLOY_QT=OFF \
            -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Report
        run: |
          mkdir -p coverage
          gcovr -r . --object-directory build --exclude-directories 'build/CMakeFiles/[0-9.]+' \
            --filter 'src/' --exclude 'src/app/' -j "$(nproc)" \
            --print-summary --markdown-summary coverage/summary.md --html-details coverage/index.html
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
