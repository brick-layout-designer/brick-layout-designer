name: Nightly

on:
  push:
    branches: [main]

# actions/checkout@v7 et al currently target Node 20, which GitHub
# starts forcing off in June 2026. Opt into Node 24 now so the
# deprecation warnings stop cluttering the logs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      artifact-suffix: -nightly

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: |
            **Nightly pre-release** built automatically from the latest commit on `main`.

            These are unsigned, AI-assisted builds — **use tagged releases for stability**
            and keep backups of any `.bbm` you care about. See the README for the
            full AI-assisted / vibe-coded warning.
          files: artifacts/*
          prerelease: true
          make_latest: false
